name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        features: ["", "--features derisk/host"]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.95 --profile minimal --component clippy,rustfmt && rustup default 1.95
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl-dev libgles-dev libpam0g-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo test --workspace ${{ matrix.features }}

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Clippy and tests for the default and host builds, rustfmt and the
      # packages; see `checks` in flake.nix.
      - run: nix flake check -L
      - name: Dev shell
        run: nix develop -i -k TERM -k HOME -c cargo --version
