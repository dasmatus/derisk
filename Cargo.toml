[workspace]
resolver = "3"
members = ["crates/*"]
# A bare `cargo build`, `cargo test` or `cargo run` at the root means derisk
# itself and the shell crates its binary is made of, as it did when derisk
# was the root package. The apps, the portal and the GPUI runtime are built
# by name (`-p`) or with `--workspace`.
default-members = [
    "crates/derisk",
    "crates/derisk-desktop",
    "crates/derisk-geom",
    "crates/derisk-install",
    "crates/derisk-login",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
repository = "https://github.com/dasmatus/derisk"

[workspace.dependencies]
# Every mcsapi crate comes from the same mcsapi revision so the apps and the
# compositor share one mcsapi-ui; `cargo update -p mcsapi` moves them together.
mcsapi = { git = "https://github.com/dasmatus/mcsapi" }
mcsapi-ui = { git = "https://github.com/dasmatus/mcsapi" }
mcsapi-runtime = { git = "https://github.com/dasmatus/mcsapi" }
mcsapi-theme = { git = "https://github.com/dasmatus/mcsapi" }
mcsapi-components = { git = "https://github.com/dasmatus/mcsapi" }
mcsapi-components-gpui = { git = "https://github.com/dasmatus/mcsapi" }
mcsapi-compositor = { git = "https://github.com/dasmatus/mcsapi" }
mcsapi-hardened-malloc = { git = "https://github.com/dasmatus/mcsapi" }
derisk-desktop = { path = "crates/derisk-desktop", version = "0.1.0" }
derisk-geom = { path = "crates/derisk-geom", version = "0.1.0" }
derisk-install = { path = "crates/derisk-install", version = "0.1.0" }
derisk-login = { path = "crates/derisk-login", version = "0.1.0" }
derisk-settings = { path = "crates/derisk-settings", version = "0.1.0" }
derisk-files = { path = "crates/derisk-files", version = "0.1.0" }
derisk-editor = { path = "crates/derisk-editor", version = "0.1.0" }
derisk-monitor = { path = "crates/derisk-monitor", version = "0.1.0" }
derisk-calculator = { path = "crates/derisk-calculator", version = "0.1.0" }
derisk-apps = { path = "crates/derisk-apps", version = "0.1.0" }
derisk-icons = { path = "crates/derisk-icons", version = "0.1.0" }
derisk-gpui = { path = "crates/derisk-gpui", version = "0.1.0" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# One codegen unit and fat LTO across every crate, mcsapi included: release
# builds are the ones that ship, so they trade build time for inlining across
# crate boundaries and a smaller binary. CI tests in the dev profile.
[profile.release]
lto = true
codegen-units = 1
