[package]
name = "derisk"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "An adaptive, agent-first Wayland desktop shell built on mcsapi"
license = "GPL-3.0-only"
repository = "https://github.com/dasmatus/derisk"

[dependencies]
mcsapi = { git = "https://github.com/dasmatus/mcsapi", branch = "claude/finish-derisk-1xutar" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# `derisk session` runs on mcsapi-compositor with the derisk core apps. Off by
# default so the shell library and headless commands build without graphics.
# Tracks the mcsapi branch that adds the compositor (stacked on the derisk
# apps PR) until both land on mcsapi main.
derisk-apps = { git = "https://github.com/dasmatus/mcsapi", branch = "claude/finish-derisk-1xutar", optional = true }
mcsapi-compositor = { git = "https://github.com/dasmatus/mcsapi", branch = "claude/finish-derisk-1xutar", optional = true }
mcsapi-runtime = { git = "https://github.com/dasmatus/mcsapi", branch = "claude/finish-derisk-1xutar", optional = true }

[features]
host = ["dep:derisk-apps", "dep:mcsapi-compositor", "dep:mcsapi-runtime"]
