[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
repository = "https://github.com/dasmatus/derisk"

[workspace.dependencies]
mcsapi = { git = "https://github.com/dasmatus/mcsapi" }
mcsapi-ui = { git = "https://github.com/dasmatus/mcsapi" }
mcsapi-runtime = { git = "https://github.com/dasmatus/mcsapi" }
derisk-settings = { path = "crates/derisk-settings", version = "0.1.0" }
derisk-files = { path = "crates/derisk-files", version = "0.1.0" }
derisk-editor = { path = "crates/derisk-editor", version = "0.1.0" }
derisk-monitor = { path = "crates/derisk-monitor", version = "0.1.0" }
derisk-calculator = { path = "crates/derisk-calculator", version = "0.1.0" }
derisk-apps = { path = "crates/derisk-apps", version = "0.1.0" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[package]
name = "derisk"
description = "An adaptive, agent-first Wayland desktop shell built on mcsapi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
derisk-settings.workspace = true
mcsapi.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# The Smithay compositor host (`derisk session`). Off by default so the shell
# library and the headless commands build without graphics libraries.
egui_glow = { version = "0.36.2", default-features = false, optional = true }
glow = { version = "0.17", optional = true }
smithay = { version = "0.7.0", default-features = false, features = ["backend_winit", "desktop", "renderer_gl", "wayland_frontend"], optional = true }

[features]
host = ["dep:egui_glow", "dep:glow", "dep:smithay"]
