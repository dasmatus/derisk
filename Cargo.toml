[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
repository = "https://github.com/dasmatus/derisk"

[workspace.dependencies]
# Until dasmatus/mcsapi#23 (frame pacing by refresh rate and VRR) merges, every
# mcsapi crate comes from its branch so the apps and the compositor share one
# mcsapi-ui. Then drop the `branch` keys and run `cargo update -p mcsapi`.
mcsapi = { git = "https://github.com/dasmatus/mcsapi", branch = "claude/blur-lowpower-modes-yk3xx0" }
mcsapi-ui = { git = "https://github.com/dasmatus/mcsapi", branch = "claude/blur-lowpower-modes-yk3xx0" }
mcsapi-runtime = { git = "https://github.com/dasmatus/mcsapi", branch = "claude/blur-lowpower-modes-yk3xx0" }
mcsapi-compositor = { git = "https://github.com/dasmatus/mcsapi", branch = "claude/blur-lowpower-modes-yk3xx0" }
derisk-settings = { path = "crates/derisk-settings", version = "0.1.0" }
derisk-files = { path = "crates/derisk-files", version = "0.1.0" }
derisk-editor = { path = "crates/derisk-editor", version = "0.1.0" }
derisk-monitor = { path = "crates/derisk-monitor", version = "0.1.0" }
derisk-calculator = { path = "crates/derisk-calculator", version = "0.1.0" }
derisk-apps = { path = "crates/derisk-apps", version = "0.1.0" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[package]
name = "derisk"
description = "An adaptive, agent-first Wayland desktop shell built on mcsapi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
derisk-settings.workspace = true
mcsapi.workspace = true
# App icons from the icon theme: PNG and SVG, the two formats themes ship.
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# `derisk session` runs on mcsapi-compositor with the derisk core apps. Off by
# default so the shell library and headless commands build without graphics.
derisk-apps = { workspace = true, optional = true }
mcsapi-compositor = { workspace = true, optional = true }
mcsapi-runtime = { workspace = true, optional = true }

[features]
host = ["dep:derisk-apps", "dep:mcsapi-compositor", "dep:mcsapi-runtime"]

