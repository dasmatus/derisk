[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
repository = "https://github.com/dasmatus/derisk"

[workspace.dependencies]
# Until dasmatus/mcsapi#24 (a lock cancels the held press; it builds on #23's
# frame pacing by refresh rate and VRR) merges, every mcsapi crate comes from
# its branch so the apps and the compositor share one mcsapi-ui. Then drop the
# `branch` keys and run `cargo update -p mcsapi`.
mcsapi = { git = "https://github.com/dasmatus/mcsapi", branch = "claude/lock-cancels-pointer" }
mcsapi-ui = { git = "https://github.com/dasmatus/mcsapi", branch = "claude/lock-cancels-pointer" }
mcsapi-runtime = { git = "https://github.com/dasmatus/mcsapi", branch = "claude/lock-cancels-pointer" }
mcsapi-compositor = { git = "https://github.com/dasmatus/mcsapi", branch = "claude/lock-cancels-pointer" }
derisk-settings = { path = "crates/derisk-settings", version = "0.1.0" }
derisk-files = { path = "crates/derisk-files", version = "0.1.0" }
derisk-editor = { path = "crates/derisk-editor", version = "0.1.0" }
derisk-monitor = { path = "crates/derisk-monitor", version = "0.1.0" }
derisk-calculator = { path = "crates/derisk-calculator", version = "0.1.0" }
derisk-apps = { path = "crates/derisk-apps", version = "0.1.0" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[package]
name = "derisk"
description = "An adaptive, agent-first Wayland desktop shell built on mcsapi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
derisk-settings.workspace = true
mcsapi.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# `derisk session` runs on mcsapi-compositor with the derisk core apps. Off by
# default so the shell library and headless commands build without graphics.
derisk-apps = { workspace = true, optional = true }
mcsapi-compositor = { workspace = true, optional = true }
mcsapi-runtime = { workspace = true, optional = true }
# The lock screen's PAM conversation allocates with libc, which PAM frees.
libc = { version = "0.2", optional = true }

[features]
host = [
    "dep:derisk-apps",
    "dep:libc",
    "dep:mcsapi-compositor",
    "dep:mcsapi-runtime",
]

