# Which backend serves each portal in a derisk session (XDG_CURRENT_DESKTOP=derisk).
# derisk serves what only the session knows and the portals it has its own
# dialogs for; the GTK backend serves the rest.
[preferred]
default=gtk
org.freedesktop.impl.portal.Settings=derisk;gtk
org.freedesktop.impl.portal.Screenshot=derisk
org.freedesktop.impl.portal.Wallpaper=derisk
org.freedesktop.impl.portal.Background=derisk
org.freedesktop.impl.portal.FileChooser=derisk
org.freedesktop.impl.portal.Access=derisk
org.freedesktop.impl.portal.AppChooser=derisk
