# Which backend serves each portal in a derisk session (XDG_CURRENT_DESKTOP=derisk).
# derisk serves what only the session knows; the GTK backend serves the rest,
# including the access dialog derisk's own portals fall back to when
# derisk-gpui, which draws their consent dialog, is not installed.
# Screen sharing is xdg-desktop-portal-wlr's, over the compositor's capture
# protocols, asking which screen or window through `derisk choose`.
[preferred]
default=gtk
org.freedesktop.impl.portal.Settings=derisk;gtk
org.freedesktop.impl.portal.Screenshot=derisk
org.freedesktop.impl.portal.Wallpaper=derisk
org.freedesktop.impl.portal.Background=derisk
org.freedesktop.impl.portal.ScreenCast=wlr
