[package]
name = "derisk-portal"
description = "xdg-desktop-portal backend for derisk: appearance, screenshots, wallpaper, background apps, files, access and Open With"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xdg-desktop-portal-derisk"
path = "src/main.rs"

[dependencies]
# The portal backend traits and their D-Bus glue. Only the interfaces derisk
# serves are switched on; the rest (printing, inhibit, ...) come from the
# GTK backend, which derisk-portals.conf puts behind this one. Access and
# AppChooser come with `backend`.
ashpd = { version = "0.13.13", default-features = false, features = ["backend", "tokio", "settings", "screenshot", "wallpaper", "background", "file_chooser"] }
# Desktop entries for app names and icons.
derisk.workspace = true
# The dialogs' requests and replies; derisk-portal-dialog draws them.
derisk-portal-ui.workspace = true
# Cropping a window or area out of a screenshot.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# The wallpaper portal writes the same settings file the Settings app does.
derisk-settings.workspace = true
serde_json = "1.0.145"
tokio = { version = "1.43", features = ["rt", "macros", "net", "io-util", "process", "sync", "time"] }
